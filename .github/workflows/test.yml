name: Generate Contributors Image

on:
  push:
    paths:
      - .all-contributorsrc

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contributors image on main branch
        uses: skyash-dev/all-contributors-image@ed20564643cd82f042d5d86124f7ff4a05a0213a
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
